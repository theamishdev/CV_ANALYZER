services:
  # Backend Web Service (Docker runtime for Puppeteer + Python ML)
  - type: web
    name: cv-analyzer-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: XAI_API_KEY
        sync: false

  # Frontend Web Service (Docker Nginx runtime)
  - type: web
    name: cv-analyzer-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 80
      - key: BACKEND_URL
        value: http://cv-analyzer-backend:3000/api/
